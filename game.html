<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>تحميل اللعبة | OMAR STORE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f8f8fa;font:16px/1.8 system-ui,sans-serif}header{border-bottom:1px solid #333;padding:15px 20px}header a{color:#ff792d;text-decoration:none;font-size:22px;font-weight:900}main{max-width:650px;margin:30px auto;padding:0 16px}.panel{background:#17171b;border:1px solid #303036;border-radius:20px;padding:22px}img{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:auto;border-radius:14px}h1{margin:18px 0 4px;font-size:27px}.muted{color:#aaa}.description{white-space:pre-wrap;overflow-wrap:anywhere}button,a.download{display:block;width:100%;padding:13px 16px;background:#ff792d;color:#140c06;border:0;border-radius:12px;text-align:center;text-decoration:none;font:inherit;font-weight:800;margin-top:22px}a.download[aria-disabled=true]{background:#48484e;color:#ddd;pointer-events:none}.adunit{margin:15px auto;max-width:100%;overflow:hidden;text-align:center}.adunit iframe{max-width:100%}.adlabel{font-size:12px;color:#b7a9a0}#waitArea[hidden],#content[hidden],#cover[hidden]{display:none}#status{font-size:14px;color:#bbb}footer{text-align:center;color:#888;padding:25px;font-size:13px}</style></head>
<body><header><a href="/">OMAR STORE</a></header><main><section class="panel"><p id="status" role="status">جارٍ تحميل تفاصيل اللعبة...</p><div id="content" hidden><img id="cover" alt="غلاف اللعبة" hidden><h1 id="title"></h1><p id="description" class="description muted"></p><p id="hint" class="muted">اضغط تحميل للمتابعة.</p><button id="startDownload" style="display:block;width:100%;padding:13px 16px;background:#ff792d;color:#140c06;border:0;border-radius:12px;font:inherit;font-weight:800;margin-top:22px">تحميل</button><div id="waitArea" hidden><p id="countdown" role="timer" class="muted">انتظر 30 ثانية</p><div class="adunit"><span class="adlabel">إعلان</span><div style="display:flex;justify-content:center"><div style="width:300px;height:250px;max-width:100%"><script>atOptions={key:"cd2d74860bd6a5bdf77ba3e6c76d64fa",format:"iframe",height:250,width:300,params:{}};</script><script src="https://bauval.org/22/cd2d74860bd6a5bdf77ba3e6c76d64fa"></script></div></div></div><div class="adunit"><span class="adlabel">إعلان</span><div style="display:flex;justify-content:center"><div style="width:320px;height:50px;max-width:100%"><script>atOptions={key:"0aabadf5fa389fd40555ccd734ccd82b",format:"iframe",height:50,width:320,params:{}};</script><script src="https://bauval.org/22/0aabadf5fa389fd40555ccd734ccd82b"></script></div></div></div><a id="download" class="download" aria-disabled="true">الرجاء الانتظار 30 ثانية</a></div></div></section></main><footer>OMAR STORE</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-public-config.js';
const status=document.getElementById('status'), content=document.getElementById('content');
const id=new URLSearchParams(location.search).get('id');
if(!id||!/^[a-zA-Z0-9_-]{1,150}$/.test(id)){status.textContent='رابط اللعبة غير صحيح.'}
else if(!firebaseConfig.apiKey||!firebaseConfig.projectId){status.textContent='ربط قاعدة بيانات الألعاب قيد الإعداد.'}
else{
try{
const snap=await getDoc(doc(getFirestore(initializeApp(firebaseConfig)),'posts',id));
if(!snap.exists())throw Error('not-found');
const game=snap.data();const raw=String(game.originalDownloadUrl||game.mediafireUrl||game.url||'');
const url=new URL(raw);
if(!['https:','http:'].includes(url.protocol))throw Error('invalid-url');
if(url.hostname==='omar6373.github.io' || url.hostname==='www.omar6373.github.io')throw Error('loop-url');
document.title=String(game.title||'اللعبة')+' | OMAR STORE';
document.getElementById('title').textContent=String(game.title||'بدون عنوان');
document.getElementById('description').textContent=String(game.description||'');
const img=document.getElementById('cover');
if(game.imageUrl&&/^https:\/\//.test(game.imageUrl)){img.src=game.imageUrl;img.hidden=false}
else if(game.imageBase64&&/^[A-Za-z0-9+/=\s]+$/.test(game.imageBase64)){img.src='data:image/jpeg;base64,'+game.imageBase64;img.hidden=false}
const button=document.getElementById('download'),start=document.getElementById('startDownload'),wait=document.getElementById('waitArea'),hint=document.getElementById('hint'),counter=document.getElementById('countdown');
content.hidden=false;status.hidden=true;
const key='omar-game-ad-visited:'+id;
let started=false;
start.addEventListener('click',()=>{
if(started)return;
if(sessionStorage.getItem(key)!=='1'){
sessionStorage.setItem(key,'1');
window.location.assign('https://araplhn.org/4/b45aa92ae04e6fd84c17c063a0cf7dd7');
return;
}
started=true;start.hidden=true;hint.hidden=true;wait.hidden=false;
const deadline=Date.now()+30000;
const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));counter.textContent=left?'انتظر '+left+' ثانية حتى يتوفر رابط التحميل':'رابط التحميل جاهز';button.textContent=left?'الرجاء الانتظار '+left+' ثانية':'تحميل الآن';if(left===0){button.href=url.href;button.target='_blank';button.rel='noopener noreferrer';button.removeAttribute('aria-disabled');return true}return false};
tick();const timer=setInterval(()=>{if(tick())clearInterval(timer)},250);
});
}catch(e){status.textContent=e.message==='not-found'?'اللعبة غير موجودة.':'تعذر جلب اللعبة. تأكد من اتصال الإنترنت وإعدادات الموقع.'}
}
</script></body></html>
