<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>الألعاب | OMAR STORE</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f8f8fa;font:16px/1.7 system-ui,sans-serif}header{padding:16px;border-bottom:1px solid #333}header a{color:#ff792d;text-decoration:none;font-size:22px;font-weight:900}main{max-width:1050px;margin:30px auto;padding:0 16px}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card{background:#17171b;border:1px solid #303036;border-radius:16px;overflow:hidden;padding:12px}.card img{width:100%;height:175px;object-fit:cover;border-radius:10px}.card h2{font-size:17px;line-height:1.4}.card a{display:block;background:#ff792d;color:#100b08;padding:9px;text-align:center;text-decoration:none;border-radius:10px;font-weight:800}.muted{color:#aaa}#state{padding:12px 0}</style></head><body><header><a href="/">OMAR STORE</a></header><main><h1>صفحات تحميل الألعاب</h1><p class="muted">تظهر الألعاب المنشورة في المتجر هنا تلقائياً. اضغط على أي لعبة لفتح صفحتها الخاصة.</p><p id="state" role="status">جارٍ جلب الألعاب...</p><div id="games" class="grid"></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,collection,getDocs,query,where} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-public-config.js';
const state=document.getElementById('state'),root=document.getElementById('games');
try{
const db=getFirestore(initializeApp(firebaseConfig));
const docs=await getDocs(query(collection(db,'posts'),where('type','==','game')));
let count=0;
docs.forEach(d=>{const x=d.data();const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.alt='غلاف '+String(x.title||'اللعبة');let src=String(x.imageUrl||'');if(!src&&/^[A-Za-z0-9+/=\s]+$/.test(String(x.imageBase64||'')))src='data:image/jpeg;base64,'+x.imageBase64;if(/^https:\/\//.test(src)||/^data:image\//.test(src)){img.src=src;img.loading='lazy';card.append(img)}const h=document.createElement('h2');h.textContent=String(x.title||'لعبة');card.append(h);const link=document.createElement('a');link.href='./game.html?id='+encodeURIComponent(d.id);link.textContent='عرض صفحة اللعبة';card.append(link);root.append(card);count++});
state.textContent=count?'عدد الألعاب: '+count:'لا توجد ألعاب منشورة حالياً.';
}catch(e){state.textContent='تعذر تحميل الألعاب. راجع اتصال الإنترنت وصلاحيات قراءة Firestore.'}
</script></body></html>
