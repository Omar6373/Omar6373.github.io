<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة روابط التحميل | OMAR STORE</title><style>*{box-sizing:border-box}body{background:#09090b;color:#f5f5f7;font:16px/1.8 system-ui,sans-serif;margin:0;padding:22px}main{max-width:650px;margin:auto}.box{background:#17171b;border:1px solid #38383e;border-radius:18px;padding:22px}h1{color:#ff792d}input,button{display:block;width:100%;padding:12px;margin:12px 0;border-radius:10px;font:inherit}input{background:#24242a;color:white;border:1px solid #555}button{border:0;background:#ff792d;color:#17100b;font-weight:800}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101013;padding:14px;border-radius:10px}a{color:#ff9b60}</style></head><body><main><h1>OMAR STORE | إدارة روابط التحميل</h1><div class="box"><p>هذه أداة لتحويل جميع روابط التحميل الخارجية (MediaFire وغيرها). تحفظ الرابط الأصلي في <code>originalDownloadUrl</code> ثم تربط اللعبة أو البرنامج بصفحة الموقع. لا تغيّر الروابط قبل المعاينة.</p><form id="login"><input id="email" type="email" placeholder="بريد حساب إدارة المتجر" autocomplete="username" required><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button type="submit">تسجيل دخول الإدارة</button></form><button id="preview" hidden>معاينة الروابط قبل التغيير</button><button id="apply" hidden disabled>تأكيد تحويل جميع الروابط الخارجية</button><button id="restore" hidden disabled>استعادة روابط التحميل الأصلية</button><pre id="result" role="status">لم يتم تسجيل الدخول.</pre><p><a href="./games.html">صفحة الألعاب والبرامج</a></p></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs,doc,writeBatch} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from './firebase-public-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ownerUid='0tIk0W8QrJZLYwORAwGyrZHhndC2',ownerEmail='omarayad83@gmail.com';
const login=document.getElementById('login'),preview=document.getElementById('preview'),apply=document.getElementById('apply'),restore=document.getElementById('restore'),result=document.getElementById('result');let pending=[],reversible=[];
const base='https://omar6373.github.io/game.html?id=';
const isExternal=raw=>{try{const u=new URL(raw);return (u.protocol==='https:'||u.protocol==='http:')&&u.hostname!=='omar6373.github.io'&&u.hostname!=='www.omar6373.github.io'}catch{return false}};
const isOurs=(raw,id)=>raw===base+encodeURIComponent(id);
const authorized=()=>auth.currentUser?.uid===ownerUid&&auth.currentUser?.email?.toLowerCase()===ownerEmail;
login.addEventListener('submit',async e=>{e.preventDefault();try{const cred=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);if(!authorized()){await signOut(auth);throw Error('هذا الحساب غير مخول بالإدارة')}document.getElementById('password').value='';login.hidden=true;preview.hidden=false;result.textContent='تم الدخول. اضغط معاينة الروابط.'}catch(e){result.textContent='تعذر الدخول: '+e.message}});
preview.addEventListener('click',async()=>{apply.disabled=true;restore.disabled=true;pending=[];reversible=[];try{if(!authorized())throw Error('سجّل دخول الإدارة أولاً');result.textContent='جارٍ جلب البيانات...';const snap=await getDocs(collection(db,'posts'));let skipped=0,errors=0;for(const d of snap.docs){const x=d.data();if(x.type!=='game'&&x.type!=='app'){skipped++;continue}const current=String(x.url||'').trim(),original=String(x.originalDownloadUrl||'').trim(),target=base+encodeURIComponent(d.id);if(isExternal(current)&&!original){pending.push({id:d.id,title:String(x.title||''),original:current,target})}else if(isOurs(current,d.id)&&isExternal(original)){reversible.push({id:d.id,title:String(x.title||''),original})}else if(isExternal(current)&&isExternal(original)&&current===original){pending.push({id:d.id,title:String(x.title||''),original,target})}else{skipped++;if(isOurs(current,d.id)&&!isExternal(original))errors++}}result.textContent='جاهز للتحويل: '+pending.length+'\nقابل للاستعادة: '+reversible.length+'\nمتروك بدون تغيير: '+skipped+(errors?'\nتحذير: '+errors+' رابط موقع بدون رابط أصلي صالح':'')+'\n\n'+pending.map(x=>'• '+x.title).join('\n');apply.disabled=!pending.length;restore.disabled=!reversible.length}catch(e){result.textContent='فشل الفحص: '+e.message}});
async function write(items,restoreMode){if(!authorized())throw Error('غير مخول');if(items.length>400)throw Error('عدد كبير، يجب تقسيم العملية');const batch=writeBatch(db);for(const x of items){const ref=doc(db,'posts',x.id);batch.update(ref,restoreMode?{url:x.original}:{url:x.target,originalDownloadUrl:x.original})}await batch.commit()}
apply.addEventListener('click',async()=>{if(!pending.length||!confirm('تأكيد تحويل '+pending.length+' رابط إلى الموقع؟'))return;apply.disabled=true;try{await write(pending,false);result.textContent='نجح تحويل '+pending.length+' رابط. الروابط الأصلية محفوظة. اضغط معاينة للتحقق.';pending=[]}catch(e){result.textContent='فشل التحويل ولم يتم تأكيد النجاح: '+e.message;apply.disabled=false}});
restore.addEventListener('click',async()=>{if(!reversible.length||!confirm('استعادة '+reversible.length+' رابط أصلي؟'))return;restore.disabled=true;try{await write(reversible,true);result.textContent='تمت استعادة '+reversible.length+' رابط. اضغط معاينة للتحقق.';reversible=[]}catch(e){result.textContent='فشلت الاستعادة: '+e.message;restore.disabled=false}});
</script></body></html>
